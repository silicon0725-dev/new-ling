# 「灵」桌面应用：slint UI + 五页工作台
[package]
name = "ling-app"
version.workspace = true
edition.workspace = true
description = "「灵」桌面应用：深色单色 slint UI，侧边导航五页（对话 / 角色 / 领地 / 星图 / 设置）"

[dependencies]
# UI 框架：默认特性即 winit 后端 + femtovg 渲染器；
# 锁定环境缓存版本，保证离线可构建（与 ling-render 锁定 wgpu 同理）
slint = "=1.18.1"
# 异步运行时：驱动 LLM 流式请求等后台任务
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
# 序列化：设置持久化与全量数据导出 / 导入
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 领域核心：LLM 客户端（带 SSRF 防护）、角色 / 记忆 / 世界模型、SQLite 仓储
ling-core = { path = "../ling-core" }
# 星图离屏渲染器：后台线程驱动，RGBA 帧转 slint::Image 显示
ling-render = { path = "../ling-render" }
# 与 ling-core 同版本：经 Store::conn() 自定义查询时必须用 params! 参数绑定
rusqlite = { version = "0.32", features = ["bundled"] }
# 消费 ling-core::ai 的 Stream 接口（ling-core 已依赖，无新增下载）
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[build-dependencies]
slint-build = "=1.18.1"
